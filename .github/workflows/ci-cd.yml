name: Backend CI/CD

on:
  pull_request:
    branches:
      - develop
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: backend-ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-master-source:
    name: Validate master source
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.base.ref == 'master'

    steps:
      - name: Require develop or hotfix source branch
        if: >
          github.event.pull_request.head.ref != 'develop' &&
          !startsWith(github.event.pull_request.head.ref, 'hotfix/') &&
          !startsWith(github.event.pull_request.head.ref, 'hotFix/')
        run: |
          echo "Only pull requests from develop, hotfix/*, or hotFix/* can target master."
          exit 1

      - name: Source branch allowed
        if: >
          github.event.pull_request.head.ref == 'develop' ||
          startsWith(github.event.pull_request.head.ref, 'hotfix/') ||
          startsWith(github.event.pull_request.head.ref, 'hotFix/')
        run: echo "Source branch is allowed."

  checks:
    name: Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/journally_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/journally_ci
      JWT_SECRET: ci_jwt_secret
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:3000
      SERVER: localhost
      SALT_ROUND: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: journally_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run generate

      - name: Run migrations
        run: pnpm run db:migrate:deploy

      - name: Check for tests
        id: tests
        run: |
          if find src scripts -type f \( -name "*.test.ts" -o -name "*.spec.ts" \) | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No tests found yet; skipping test step."
          fi

      - name: Test
        if: steps.tests.outputs.found == 'true'
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build
