services:
    db-test:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: journally_test
        ports:
            - "127.0.0.1:5435:5432"
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d journally_test"]
            interval: 2s
            timeout: 5s
            retries: 15
